name: building-block

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  echo-hello:
    runs-on: ubuntu-latest
    steps:
      - name: Say Hello
        run: echo "Hello, World!"
  
  echo-goodbye:
    runs-on: ubuntu-latest
    steps:
      - name: Failed step
        run: |
          echo "This step will fail"
          exit 1
      - name: Say Goodbye
        run: echo "Goodbye, World!"
