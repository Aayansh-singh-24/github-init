name: Expression
run-name: Using Expressions | Debug -${{ inputs.debug && 'ON' || 'OFF' }}
# DEBUG - ON || DEBUG - OFF


on: 
  workflow_dispatch:
    inputs:
      debug:
        description: Enable debug output
        required: false
        default: false
        type: boolean

jobs:
    echo:
        runs-on: ubuntu-latest
        steps:
            - name: "{Debug} Print Startup Data"
              run: |
                echo "Trigger by: ${{ github.event_name }}"
                echo "Branch: ${{ github.ref_name }}"
                echo "Commit SHA: ${{ github.sha }}"
                echo "Actor: ${{ github.actor }}"
                echo "Runner os: ${{ runner.os }}"
                echo "workflow: ${{ github.workflow }}"
            - name: "{Debug} Print Environment Variables"
              if: inputs.debug && github.ref_name == 'main'
              run: |
                echo "This workflow is running on the main branch and debug is enabled"
            - name: Greeting
              run: |
                echo "Hello, ${{ github.actor }}! Welcome to the Expression workflow."


